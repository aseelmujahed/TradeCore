apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradecore-api
  labels:
    app.kubernetes.io/name: tradecore-api
    app.kubernetes.io/part-of: tradecore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tradecore-api
      app.kubernetes.io/part-of: tradecore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tradecore-api
        app.kubernetes.io/part-of: tradecore
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: tradecore-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tradecore-config
          env:
            - name: ConnectionStrings__TradeCoreDatabase
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: connection-string
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: rabbitmq-user
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: rabbitmq-password
            - name: Database__MigrateOnStartup
              value: "false"
            - name: Database__ExitAfterMigration
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
