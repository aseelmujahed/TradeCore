apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tradecore

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: tradecore

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: tradecore

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: tradecore

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: postgres-user

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: postgres-password

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          startupProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: tradecore

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi