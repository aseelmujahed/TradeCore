# Copy this file to secret.local.yaml, replace every placeholder, and apply the
# local copy. secret.local.yaml is intentionally ignored by Git.
apiVersion: v1
kind: Secret
metadata:
  name: tradecore-credentials
  namespace: tradecore
  labels:
    app.kubernetes.io/part-of: tradecore
type: Opaque
stringData:
  postgres-user: REPLACE_WITH_POSTGRES_USER
  postgres-password: REPLACE_WITH_POSTGRES_PASSWORD
  rabbitmq-user: REPLACE_WITH_RABBITMQ_USER
  rabbitmq-password: REPLACE_WITH_RABBITMQ_PASSWORD
  connection-string: Host=postgres;Port=5432;Database=tradecore;Username=REPLACE_WITH_POSTGRES_USER;Password=REPLACE_WITH_POSTGRES_PASSWORD
