apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradecore-trading-engine
  labels:
    app.kubernetes.io/name: tradecore-trading-engine
    app.kubernetes.io/part-of: tradecore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tradecore-trading-engine
      app.kubernetes.io/part-of: tradecore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tradecore-trading-engine
        app.kubernetes.io/part-of: tradecore
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: trading-engine
          image: tradecore-trading-engine:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tradecore-config
          env:
            - name: ConnectionStrings__TradeCoreDatabase
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: connection-string
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: rabbitmq-user
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: tradecore-credentials
                  key: rabbitmq-password
            - name: Database__MigrateOnStartup
              value: "false"
            - name: Database__ExitAfterMigration
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
